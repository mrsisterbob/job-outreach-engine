name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No secrets are provided on purpose: the suite is fully offline (no network, no live CRM,
      # its own temp SQLite file via JOBS_DB_PATH) and must stay that way. If a test ever needs a
      # credential here, that test has grown a live dependency and should be fixed, not fed a key.
      - name: Run Tests
        run: python -m pytest -q
